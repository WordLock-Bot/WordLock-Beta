services:
  db:
    image: postgres:16-alpine
    container_name: wordlock-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: wordlock
      POSTGRES_PASSWORD: wordlock
      POSTGRES_DB: wordlock
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wordlock"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: wordlock-api:latest
    container_name: wordlock-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://wordlock:wordlock@db:5432/wordlock
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    image: wordlockbot:latest
    container_name: wordlockbot
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://wordlock:wordlock@db:5432/wordlock
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
